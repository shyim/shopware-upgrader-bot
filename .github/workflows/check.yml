name: Check

# Type-checks the bot and repositories.ts, then loads the configuration the
# way the upgrade workflow does.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check
